<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LASUED Portal - Profile</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">LASUED Portal</div>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="results.html">Results</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="payments.html">Payments</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
                <li><a href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>Student Profile</h1>

        <!-- Profile Card -->
        <div class="card">
            <h3>Personal Information</h3>
            <form id="profileForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" readonly>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" readonly>
                </div>
                <div class="form-group">
                    <label for="matricNo">Matric Number</label>
                    <input type="text" id="matricNo" name="matricNo" readonly>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" name="department">
                </div>
                <div class="form-group">
                    <label for="level">Level</label>
                    <input type="number" id="level" name="level" min="1" max="7">
                </div>
                <button type="submit" class="btn-primary">Save Changes</button>
                <p class="error-message" id="profileError"></p>
                <p class="success-message" id="profileSuccess"></p>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
